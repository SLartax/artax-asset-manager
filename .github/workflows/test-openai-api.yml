name: Build and Security Validation (No Secrets)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-openai:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security regression tests (no external API requests)
        run: npm test

      - name: Dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Build project
        run: npm run build

      - name: Run TypeScript type check
        run: npm run typecheck

      # Deliberately no API credentials are injected into builds or pull-request code.
      # AI integration tests require a dedicated, restricted server-side test setup.
